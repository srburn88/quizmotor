function getCtx(){if(!window._qmcCtx){try{window._qmcCtx=new(window.AudioContext||window.webkitAudioContext)();}catch{}}return window._qmcCtx;}
function playBeep(freq=440,dur=0.1,type="sine",vol=0.3){const c=getCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}

function App() {

  const [apiKeyInput, setApiKeyInput] = useState("");
  const [isPremium, setIsPremium] = useState(()=>loadJ("qmc-premium",false));
  const [showUpgrade, setShowUpgrade] = useState(false);

  const [mode, setMode] = useState("ai");
  const [numPlayers, setNumPlayers] = useState(2);
  const [playerNames, setPlayerNames] = useState(["","","",""]);
  const [aiName] = useState(AI_NAMES[Math.floor(Math.random()*AI_NAMES.length)]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [history, setHistory] = useState(()=>loadJ("qmc-history",[]));
  const [xp, setXp] = useState(()=>loadJ("qmc-xp",0));
  const [unlockedAchievements, setUnlockedAchievements] = useState(()=>loadJ("qmc-achievements",[]));
  const [notifications, setNotifications] = useState([]);
  const [questions, setQuestions] = useState([]);
  const [round, setRound] = useState(0);
  const [scores, setScores] = useState([]);
  const [timer, setTimer] = useState(TIMER_MAX);
  const [answered, setAnswered] = useState([]);
  const [revealed, setRevealed] = useState(false);
  const [roundPts, setRoundPts] = useState([]);
  const [currentPlayer, setCurrentPlayer] = useState(0);
  const [aiAnswered, setAiAnswered] = useState(null);
  const [lastResult, setLastResult] = useState(null);
  const [streak, setStreak] = useState(0);
  const [maxStreak, setMaxStreak] = useState(0);
  const [multiplier, setMultiplier] = useState(1);
  const [newlyUnlocked, setNewlyUnlocked] = useState([]);
  const [xpGained, setXpGained] = useState(0);

  const timerRef = useRef(null);
  const revealedRef = useRef(false);
  const answeredRef = useRef([]);
  const timerValRef = useRef(TIMER_MAX);
  const aiAnsweredRef = useRef(null);
  const streakRef = useRef(0);
  const startTimeRef = useRef(null);

  const ROUNDS = isPremium ? ROUNDS_PREMIUM : ROUNDS_FREE;
  const playerCount = mode==="ai"?2:numPlayers;
  const players = mode==="ai"
    ?[playerNames[0]||"Jugador 1",aiName]
    :Array.from({length:numPlayers},(_,i)=>playerNames[i]||`Jugador ${i+1}`);

  function addNotif(text,color="#f1c40f",bg="#1a1a0a"){
    const id=Date.now();
    setNotifications(n=>[...n,{id,text,color,bg}]);
    setTimeout(()=>setNotifications(n=>n.filter(x=>x.id!==id)),3200);
  }

  function unlockAchievement(id){
    setUnlockedAchievements(prev=>{
      if(prev.includes(id))return prev;
      const updated=[...prev,id]; saveJ("qmc-achievements",updated);
      const ach=ACHIEVEMENTS.find(a=>a.id===id);
      if(ach){playAchievement();addNotif(`${ach.icon} Logro: ${ach.name}`,"#f1c40f","#1a1500");}
      return updated;
    });
    setNewlyUnlocked(p=>p.includes(id)?p:[...p,id]);
  }

  function addXp(amount){
    setXp(prev=>{
      const oldLv=getLevel(prev),newXp=prev+amount,newLv=getLevel(newXp);
      if(newLv.name!==oldLv.name){playLevelUp();addNotif(`${newLv.icon} ¡Subiste a ${newLv.name}!`,"#c39bd3","#130a1a");}
      saveJ("qmc-xp",newXp); return newXp;
    });
  }

  function stopTimer(){if(timerRef.current){clearInterval(timerRef.current);timerRef.current=null;}}

  const doReveal=useCallback((fa,ft,cs,cq,cr)=>{
    if(revealedRef.current)return;
    revealedRef.current=true; stopTimer();
    const q=cq[cr],n=mode==="ai"?2:numPlayers,pts=Array(n).fill(0);
    const humanCorrect=fa[0]===q.ans&&fa[0]!==null;
    const elapsed=(Date.now()-startTimeRef.current)/1000;
    if(humanCorrect){
      streakRef.current+=1; setStreak(streakRef.current); setMaxStreak(p=>Math.max(p,streakRef.current));
      const mult=streakRef.current>=5?3:streakRef.current>=3?2:1; setMultiplier(mult);
      if(streakRef.current===3){playStreak();addNotif("🔥 ¡Racha x3! Multiplicador x2","#e74c3c","#1a0a0a");}
      if(streakRef.current===5){playStreak();addNotif("💥 ¡Racha x5! Multiplicador x3","#e74c3c","#1a0a0a");}
      if(elapsed<3)unlockAchievement("speed");
      if(streakRef.current>=3)unlockAchievement("streak3");
      if(streakRef.current>=5)unlockAchievement("streak5");
    }else{streakRef.current=0;setStreak(0);setMultiplier(1);}
    fa.forEach((a,i)=>{
      if(a!==null&&a===q.ans){
        const base=Math.max(100,Math.round((ft/TIMER_MAX)*MAX_PTS));
        const mult=i===0?(streakRef.current>=5?3:streakRef.current>=3?2:1):1;
        pts[i]=base*mult;
      }
    });
    setRoundPts(pts); setRevealed(true);
    setScores(prev=>prev.map((s,i)=>s+pts[i]));
  },[mode,numPlayers]);

  async function fetchQuestions(premium) {
    setLoading(true); setError("");
    try {
      const used = loadJ("qmc-used-qs", []);
      const available = ALL_QUESTIONS.filter(q => !used.includes(q.q));
      const pool = available.length >= ROUNDS ? available : ALL_QUESTIONS;
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      const selected = shuffled.slice(0, ROUNDS);
      const newUsed = [...used, ...selected.map(q => q.q)].slice(-100);
      saveJ("qmc-used-qs", newUsed);
      setLoading(false);
      return selected;
    } catch { setError("Error al cargar preguntas."); setLoading(false); return null; }
  }

    playRevEngine();

    setQuestions(qs); setScores(Array(playerCount).fill(0));

    streakRef.current=0;
    initRound(qs,0,Array(playerCount).fill(0)); setScreen("game");
  }

  function initRound(qs,r,sc){
    stopTimer(); revealedRef.current=false;
    const ea=Array(mode==="ai"?2:numPlayers).fill(null);
    answeredRef.current=ea; aiAnsweredRef.current=null; timerValRef.current=TIMER_MAX;
    startTimeRef.current=Date.now();
    setRound(r);setAnswered(ea);setRevealed(false);setRoundPts([]);setTimer(TIMER_MAX);setCurrentPlayer(0);setAiAnswered(null);
    timerRef.current=setInterval(()=>{
      timerValRef.current-=1; setTimer(timerValRef.current);
      if(timerValRef.current<=5&&timerValRef.current>0)playUrgent();
      else if(timerValRef.current>5)playTick();
      if(timerValRef.current<=0){stopTimer();if(!revealedRef.current)doReveal(answeredRef.current,0,sc,qs,r);}
    },1000);
    if(mode==="ai"){
      const delay=(3+Math.random()*7)*1000;
      setTimeout(()=>{
        if(revealedRef.current||aiAnsweredRef.current!==null)return;
        const correct=Math.random()<0.7;
        const ans=correct?qs[r].ans:(qs[r].ans+1+Math.floor(Math.random()*3))%4;
        aiAnsweredRef.current=ans; setAiAnswered(ans);
        const updated=[...answeredRef.current]; updated[1]=ans;
        answeredRef.current=updated; setAnswered([...updated]);
        if(updated[0]!==null)doReveal(updated,timerValRef.current,sc,qs,r);
      },delay);
    }
  }

    answeredRef.current=updated; setAnswered([...updated]);

            <div style={{marginTop:6,color:"#aaa",fontSize:14}}>Ganador: <b style={{color:winner.color}}>{winner.name}</b> {winner.isAi?"🤖":"🎉"}</div>
          </div>
          <div className="card" style={{width:"100%",maxWidth:400,padding:"12px 18px",marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{fontSize:22}}>{curLevel.icon}</div>
                <div>
                  <div className="orbitron" style={{fontSize:12,color:"#f1c40f"}}>{curLevel.name}</div>
                  <div style={{fontSize:11,color:"#666"}}>{xp} XP</div>
                </div>
              </div>
              <div className="tag tag-green pop-in">+{xpGained} XP</div>
            </div>
            <div className="xp-bar-wrap"><div className="xp-bar-fill" style={{width:`${prog}%`}}/></div>
            <div className="divider"/>
            <div style={{display:"flex",gap:16,fontSize:13,color:"#aaa"}}>
              <span>🔥 Racha máx: <b style={{color:"#e74c3c"}}>{maxStreak}</b></span>
              <span>✅ Puntos: <b style={{color:"#2ecc71"}}>{scores[0]||0}</b></span>
            </div>
          </div>
          {newlyUnlocked.length>0&&(
            <div className="card card-gold" style={{width:"100%",maxWidth:400,padding:"12px 18px",marginBottom:12}}>
              <div style={{fontSize:11,color:"#f1c40f",letterSpacing:2,marginBottom:10}}>🏅 LOGROS DESBLOQUEADOS</div>
              {newlyUnlocked.map(id=>{const a=ACHIEVEMENTS.find(x=>x.id===id);return a?(
                <div key={id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                  <span style={{fontSize:20}}>{a.icon}</span>
                  <div><div style={{fontWeight:700,color:"#f1c40f",fontSize:14}}>{a.name}</div><div style={{fontSize:12,color:"#aaa"}}>{a.desc}</div></div>
                </div>
              ):null;})}
            </div>
          )}
          <div className="card card-gold" style={{width:"100%",maxWidth:400,padding:"8px 20px 14px",marginBottom:14}}>
            <div style={{fontSize:11,color:"#aaa",letterSpacing:2,padding:"12px 0 8px"}}>CLASIFICACIÓN</div>
            {sorted.map((p,i)=>(
              <div key={i} className="podium-item">
                <span style={{fontSize:26,width:32}}>{MEDALS[i]}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:15,color:p.color}}>{p.name}{p.isAi?" 🤖":""}</div>
                  <div style={{background:"rgba(255,255,255,0.06)",borderRadius:4,height:4,marginTop:4}}>
                    <div style={{height:4,borderRadius:4,background:p.color,width:`${(p.score/(sorted[0].score||1))*100}%`,transition:"width 1s"}}/>
                  </div>
                </div>
                <div className="orbitron" style={{fontSize:14,color:p.color,fontWeight:700}}>{p.score}</div>
              </div>
            ))}
          </div>
          {!isPremium&&(
            <div style={{width:"100%",maxWidth:400,padding:"12px 16px",borderRadius:14,border:"1px solid rgba(155,89,182,0.3)",background:"rgba(155,89,182,0.08)",textAlign:"center",marginBottom:12}}>
              <div style={{fontSize:13,color:"#c39bd3",marginBottom:8}}>🔒 ¿Quieres más rondas y multijugador?</div>
              <button className="btn-premium" onClick={()=>{playClick();setShowUpgrade(true);}} style={{padding:"10px 22px"}}>⭐ Ver Premium</button>
            </div>
          )}
          <div style={{display:"flex",gap:8,width:"100%",maxWidth:400}}>
            <button className="btn-primary" onClick={goToSetup} style={{flex:1,padding:"12px 0"}}>🔄 NUEVA</button>
            <button className="btn-ghost" onClick={goToHistory} style={{flex:1}}>🏆</button>
            <button className="btn-ghost" onClick={()=>{playClick();setShowAchievements(true);}} style={{flex:1}}>🏅</button>
          </div>
        </div>
      </div>
    );
  }

  // ── HISTORY ──
  if(screen==="history"){
    const agg={};
    history.forEach(e=>{
      if(!agg[e.name])agg[e.name]={name:e.name,wins:0,best:0,last:e.date};
      agg[e.name].wins++;if(e.score>agg[e.name].best)agg[e.name].best=e.score;agg[e.name].last=e.date;
    });
    const ranked=Object.values(agg).sort((a,b)=>b.wins-a.wins||b.best-a.best);
    return(
      <div className="qmc-root">
        <style>{css}</style>
        {showUpgrade&&<UpgradeModal/>}
        <div className="hero-bg"/><div className="hero-lines"/>
        <div className="content" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20}}>
          <div style={{textAlign:"center",marginBottom:18}}>
            <div style={{fontSize:40,marginBottom:6}}>🏆</div>
            <div className="orbitron" style={{fontSize:18,fontWeight:900,background:"linear-gradient(135deg,#f1c40f,#e67e22)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>HALL OF FAME</div>
          </div>
          <div className="card card-gold" style={{width:"100%",maxWidth:440,padding:"8px 20px 14px",marginBottom:14}}>
            {!isPremium?(
              <div style={{textAlign:"center",padding:"24px 0"}}>
                <div style={{fontSize:30,marginBottom:8}}>🔒</div>
                <div style={{fontSize:14,color:"#aaa",marginBottom:14}}>El ranking es función Premium</div>
                <button className="btn-premium" onClick={()=>{playClick();setShowUpgrade(true);}} style={{padding:"10px 22px"}}>⭐ Hazte Premium</button>
              </div>
            ):ranked.length===0?(
              <div style={{textAlign:"center",padding:"24px 0",color:"#555"}}>
                <div style={{fontSize:30,marginBottom:8}}>🏁</div>
                <div>Aún no hay carreras registradas.</div>
              </div>
            ):(
              <>
                <div style={{display:"flex",gap:10,padding:"12px 0 8px",borderBottom:"1px solid rgba(255,255,255,0.08)",fontSize:11,color:"#555",letterSpacing:1}}>
                  <div style={{width:24}}>#</div><div style={{flex:1}}>PILOTO</div>
                  <div style={{width:46,textAlign:"center"}}>VIC.</div><div style={{width:54,textAlign:"right"}}>MEJOR</div>
                </div>
                {ranked.map((p,i)=>(
                  <div key={p.name} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                    <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#555",width:24,textAlign:"center"}}>{i<3?MEDALS[i]:`${i+1}`}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14,color:i===0?"#f1c40f":"#fff"}}>{p.name}</div>
                      <div style={{fontSize:11,color:"#555"}}>{p.last}</div>
                    </div>
                    <div style={{width:46,textAlign:"center"}}><span className="orbitron" style={{fontSize:12,color:"#f1c40f",fontWeight:700}}>{p.wins}</span></div>
                    <div style={{width:54,textAlign:"right"}}><span className="orbitron" style={{fontSize:12,color:"#2ecc71",fontWeight:700}}>{p.best}</span></div>
                  </div>
                ))}
              </>
            )}
          </div>
          <div style={{display:"flex",gap:8,width:"100%",maxWidth:440}}>
            <button className="btn-ghost" onClick={goToSetup} style={{flex:1}}>← VOLVER</button>
            {isPremium&&history.length>0&&<button className="btn-danger" onClick={clearHistory}>🗑️ Borrar</button>}
          </div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
